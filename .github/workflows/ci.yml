name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} (node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          # arm64 runners are not available for all platforms on GitHub Actions
          # SPEC §7.5: "run on both x64 and arm64 runners if available"
          # Uncomment the following when arm64 runners become available:
          # - ubuntu-24.04-arm64
        # Both active LTS lines. Node 20 is EOL (2026-04) and below
        # pi-coding-agent's minimum (>=22.19.0), so it is not a valid target.
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Python not required
        shell: bash
        run: |
          echo "Verifying Python is not required for this package..."
          # Check that package.json doesn't require Python
          if grep -i "python" package.json; then
            echo "ERROR: package.json contains Python references"
            exit 1
          fi
          echo "✓ No Python dependencies in package.json"

      - name: Show environment info
        shell: bash
        run: |
          echo "=== Environment Information ==="
          echo "OS: $RUNNER_OS"
          echo "Architecture: $(node -p process.arch)"
          echo "Platform: $(node -p process.platform)"
          echo "Node version: $(node -v)"
          echo "==============================="

      - name: Verify architecture and ripgrep binary
        shell: bash
        run: |
          echo "=== Architecture Verification ==="
          echo "Node.js Architecture: $(node -e 'console.log(process.arch)')"
          echo "Platform: $(node -e 'console.log(process.platform)')"
          
          # Install dependencies to get ripgrep
          npm ci --silent
          
          # Get ripgrep path
          RG_PATH=$(node -e "const {rgPath} = require('@vscode/ripgrep'); console.log(rgPath)")
          echo "Ripgrep binary path: $RG_PATH"
          
          # Verify binary exists and is executable
          if [[ -z "$RG_PATH" ]]; then
            echo "ERROR: rgPath not provided by @vscode/ripgrep"
            exit 1
          fi
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            $RG_PATH --version
          else
            "$RG_PATH" --version
          fi
          
          echo "=== Verification Complete ==="

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: npm test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm test

      - name: Verify bundled ripgrep binary
        shell: bash
        run: |
          # Verify @vscode/ripgrep provides rg binary
          RG_PATH=$(node -e "const {rgPath} = require('@vscode/ripgrep'); console.log(rgPath)")
          
          if [[ -z "$RG_PATH" ]]; then
            echo "ERROR: rgPath not provided by @vscode/ripgrep"
            exit 1
          fi
          
          echo "✓ Ripgrep binary found at: $RG_PATH"
          
          # Test that the binary is executable
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            $RG_PATH --version
          else
            "$RG_PATH" --version
          fi

      - name: Verify no Python dependency
        shell: bash
        run: |
          # Verify no Python imports or spawn calls in source
          if grep -r "child_process.*spawn.*fastcontext" src/ extensions/; then
            echo "ERROR: Found spawn call for fastcontext CLI"
            exit 1
          fi
          
          if grep -r "import.*python" src/ extensions/; then
            echo "ERROR: Found Python import"
            exit 1
          fi
          
          echo "✓ No Python dependencies found"
